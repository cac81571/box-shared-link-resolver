<!doctype html><meta charset="utf-8">
<!-- 入力欄 id は config.js の DEFAULTS キーと一致させる -->
<body style="font:13px sans-serif;width:600px">
<p>自社ドメイン（例: my-corp.ent.box.com）<br><input id="ownDomain" style="width:100%"></p>
<p>コラボ先ドメイン（例: customer-corp.ent.box.com）<br><input id="domainB" style="width:100%"></p>
<p>検索エンドポイント（{folderid}=フォルダID {updatedDays}=過去日数 {page}=ページ）<br><input id="searchEndpoints" style="width:100%"></p>
<p>検索対象</p>
<p>フォルダID<br><input id="folderId" style="width:100%"></p>
<p>更新日：過去〇日<br><input id="updatedDays" style="width:100%"></p>
<button id="save">保存</button> <span id="msg"></span>
<hr style="margin:56px 0 32px">
<p><b>共有リンクキャッシュ</b>　<button id="cacheBuild" type="button">キャッシュ再作成</button> <span id="cacheMsg"></span></p>
<div id="cacheInfo" style="background:#f8fafc;padding:10px;white-space:pre-wrap"></div>
<p style="margin:16px 0 0"><button id="cacheClear" type="button" style="color:#b91c1c">キャッシュをクリア</button> <span id="cacheClearMsg"></span></p>
<script type="module" src="options.js"></script></body>
