<!doctype html><meta charset="utf-8"><body style="font:13px sans-serif;width:600px">
<p>ドメインB（例: mycompany.ent.box.com）<br><input id="domainB" style="width:100%"></p>
<p>検索エンドポイント（1行1つ、{q}=検索語 {n}=件数）<br><textarea id="searchEndpoints" rows="5" style="width:100%"></textarea></p>

<button id="save">保存</button> <span id="msg"></span>
