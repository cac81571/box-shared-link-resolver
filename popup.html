<!-- 拡張アイコンのポップアップ。遷移先は自社ドメイン、入力はコラボ先の共有リンク -->
<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    width: 540px;
    margin: 0;
    padding: 16px;
    font: 13px/1.45 sans-serif;
    background: #dbeafe;
    color: #0f172a;
  }
  .head, .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .head { margin: 0 0 12px; }
  h1 {
    margin: 0;
    flex: 1;
    font-size: 14px;
    font-weight: 600;
  }
  #fetchedAt {
    color: #334155;
    font-size: 12px;
    white-space: nowrap;
  }
  #close { margin-left: 12px; }
  #l {
    width: 100%;
    padding: 6px 8px;
    margin: 0 0 10px;
  }
  #msg {
    margin: 0;
    color: #b91c1c;
    flex: 1;
  }
  #msg.busy { color: #334155; }
  #msg.ok { color: #15803d; }
  #msg.hint { color: #334155; }
</style>
<body>
<div class="head"><h1>Box 共有リンク を入力してください</h1><span id="fetchedAt"></span><a href="options.html" target="_blank">設定</a><a id="close" href="#">閉じる</a></div>
<input id="l" placeholder="https://(コラボ先ドメイン)/s/xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
<div class="row"><p id="msg"></p><button id="go">開く</button></div>
<script type="module" src="popup.js"></script>
</body>
